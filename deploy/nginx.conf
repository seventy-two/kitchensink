# Serve kitchensink under /kitchensink/ inside an HTTPS server block.
location /kitchensink/ {
    proxy_pass http://127.0.0.1:6030/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # The event stream stays open; don't buffer it or time it out early.
    proxy_buffering off;
    proxy_read_timeout 1h;
}
